services:
  leitor:
    build:
      context: .
      target: leitor
    image: obd-leitor
    stdin_open: true
    tty: true
    volumes:
      # O bleak fala com o BlueZ do host pelo D-Bus do sistema; o container não precisa de rede nem privilégios.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    security_opt:
      # O perfil AppArmor padrão do Docker bloqueia mensagens D-Bus vindas do container.
      - apparmor:unconfined

  testes:
    build:
      context: .
      target: testes
    image: obd-leitor-testes
    profiles: [testes]
